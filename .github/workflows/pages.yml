name: Deploy website to GitHub Pages

# Builds the static site in website/ and publishes it to GitHub Pages.
# Preview URL: https://tuiml.github.io/tuiml/  (BASE_PATH=/tuiml handles the subpath).
# For the tuiml.ai custom-domain cutover, drop BASE_PATH so build.py writes the
# CNAME and keeps root-absolute links — then point DNS at GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # build.py reads two more sources from the repo root (its TUTORIALS_DIR
      # and CHANGELOG constants). Editing either changes what the site would
      # publish, so both belong in the trigger: without them the live page
      # lags the repo until some unrelated website/ change fires a deploy.
      # Tutorials are the live case — the 19 /tutorials/ pages are built
      # straight from tutorials/*.ipynb. The changelog matters only at release
      # time, since parse_changelog() skips [Unreleased] on purpose and the
      # page lists shipped versions only.
      - 'tutorials/**'
      - 'CHANGELOG.md'
      # The API reference under website/templates/_generated/ is produced from
      # the package by scripts/generate_docs.py, which the build step below
      # runs. A docstring edit or a brand-new subpackage therefore changes what
      # the site would publish without touching website/ at all — so the
      # package and the generator both belong in the trigger. Without them the
      # API docs silently lag the library until some unrelated website/ change
      # fires a deploy (that drift is how eleven packages went missing).
      - 'tuiml/**'
      - 'scripts/generate_docs.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:   # allow manual runs from the Actions tab

# Least-privilege token: only what Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build static site
        working-directory: website
        # Root build (no BASE_PATH): build.py keeps root-absolute links and writes
        # the CNAME (tuiml.ai), so the deploy binds the custom domain. For a
        # subpath preview instead, set BASE_PATH: /tuiml here.
        # generate_docs.py is stdlib-only, so the website venv runs it fine. It
        # must come first: build.py scans _generated/ to build the API cards and
        # sidebar, so regenerating in the same job is what keeps new packages
        # from being dropped. The committed _generated/ tree is overwritten here
        # and only exists so a local `python build.py` previews without it.
        run: |
          uv sync
          uv run python ../scripts/generate_docs.py
          uv run python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
