{#
    Main Navigation Bar Component
    Usage: {% include 'components/_navbar.html' %}

    Variables:
    - active_page: Current page identifier ('home', 'docs', 'about')
#}
<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-200/50 shadow-sm">
    <div class="container mx-auto px-4 lg:px-6 h-16 flex items-center justify-between gap-4">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2.5 flex-shrink-0 group">
            <div class="text-3xl text-blue-700 transition-transform group-hover:scale-110 duration-300">
                <img src="/static/images/tuiml_logo.png?v=3" alt="TuiML" class="w-8 h-8 rounded-full">
            </div>
            <div class="flex flex-col">
                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xl tracking-tight leading-none"><span class="text-gray-900">Tui</span><span class="text-[#0c3a94]">ML</span></span>
                    <span class="px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider bg-amber-100 text-amber-700 rounded-full leading-none">Alpha</span>
                </div>
            </div>
        </a>

        <!-- Nav Links -->
        <div class="flex items-center gap-2 text-sm font-medium text-gray-600">
            <a href="/docs/getting_started.html"
                class="px-3 py-1.5 rounded-full transition-colors {{ 'text-blue-700 bg-blue-50' if active_page == 'docs' else 'text-gray-600 hover:text-gray-900 hover:bg-gray-100' }}">
                Documentation
            </a>
            <a href="/about"
                class="px-3 py-1.5 rounded-full transition-colors hidden sm:block {{ 'text-blue-700 bg-blue-50' if active_page == 'about' else 'text-gray-600 hover:text-gray-900 hover:bg-gray-100' }}">
                About
            </a>
            <a href="{{ config.github_url }}" target="_blank" rel="noopener"
                class="px-3 py-1.5 rounded-full transition-colors text-gray-600 hover:text-gray-900 hover:bg-gray-100">
                <i class="fa-brands fa-github"></i>
                <span class="hidden sm:inline ml-1">GitHub</span>
            </a>

            <!-- Mobile Menu Button -->
            <button id="mobile-menu-btn" class="sm:hidden p-2 text-gray-500 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Menu Dropdown -->
    <div id="mobile-menu" class="hidden sm:hidden border-t border-gray-200 bg-white">
        <div class="px-4 py-3 space-y-1">
            <a href="/docs/getting_started.html" class="block px-3 py-2 rounded-lg transition-colors {{ 'text-blue-700 bg-blue-50 font-semibold' if active_page == 'docs' else 'text-gray-700 hover:bg-gray-50 hover:text-blue-700' }}">Documentation</a>
            <a href="/about" class="block px-3 py-2 rounded-lg transition-colors {{ 'text-blue-700 bg-blue-50 font-semibold' if active_page == 'about' else 'text-gray-700 hover:bg-gray-50 hover:text-blue-700' }}">About</a>
            <a href="{{ config.github_url }}" target="_blank" rel="noopener" class="block px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-50 hover:text-blue-700"><i class="fa-brands fa-github mr-1"></i> GitHub</a>
        </div>
    </div>
</nav>

<script>
    // Mobile menu toggle
    document.getElementById('mobile-menu-btn')?.addEventListener('click', function() {
        document.getElementById('mobile-menu')?.classList.toggle('hidden');
    });
</script>
