{#
    User Menu Component (Login/Profile Dropdown)
    Usage: {% include 'components/_user_menu.html' %}

    This component handles both logged-in and logged-out states.
    Authentication state is managed via JavaScript/localStorage.
#}

<!-- Logged Out State -->
<div id="auth-logged-out">
    <a href="/login"
        class="px-3 py-1.5 bg-gray-800 text-white text-sm font-medium rounded-md hover:bg-gray-700 transition-colors">
        Sign in
    </a>
</div>

<!-- Logged In State -->
<div id="auth-logged-in" class="relative hidden">
    <button id="user-menu-btn"
        class="flex items-center gap-2 p-1 rounded-full hover:bg-gray-100 transition-colors">
        <div id="user-avatar"
            class="h-8 w-8 rounded-full bg-gradient-to-tr from-yellow-400 to-blue-600 flex items-center justify-center text-white text-xs font-bold shadow-inner">
            U
        </div>
        <i class="fa-solid fa-chevron-down text-xs text-gray-500"></i>
    </button>

    <!-- User Dropdown Menu -->
    <div id="user-menu-dropdown"
        class="hidden absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
        <!-- User Info -->
        <div class="px-4 py-3 border-b border-gray-100">
            <p id="dropdown-username" class="text-sm font-semibold text-gray-900">Username</p>
            <p id="dropdown-email" class="text-xs text-gray-500 truncate">email@example.com</p>
        </div>

        <!-- Menu Items -->
        <div class="py-1">
            <a id="dropdown-profile-link" href="/user/username"
                class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <i class="fa-regular fa-user w-4 text-gray-400"></i>
                Your profile
            </a>
            <a href="/settings"
                class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <i class="fa-solid fa-gear w-4 text-gray-400"></i>
                Settings
            </a>
            <a href="/settings/tokens"
                class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <i class="fa-solid fa-key w-4 text-gray-400"></i>
                API Tokens
            </a>
        </div>

        <div class="border-t border-gray-100 py-1">
            <button onclick="logout()"
                class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                <i class="fa-solid fa-right-from-bracket w-4"></i>
                Sign out
            </button>
        </div>
    </div>
</div>

<script>
    // User menu dropdown toggle
    document.getElementById('user-menu-btn')?.addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('user-menu-dropdown')?.classList.toggle('hidden');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function() {
        document.getElementById('user-menu-dropdown')?.classList.add('hidden');
    });

    // Check authentication state
    function updateUserUI(user) {
        const avatar = document.getElementById('user-avatar');
        const username = document.getElementById('dropdown-username');
        const email = document.getElementById('dropdown-email');
        const profileLink = document.getElementById('dropdown-profile-link');

        if (avatar) {
            if (user.avatar_url) {
                avatar.innerHTML = `<img src="${user.avatar_url}" alt="${user.username}" class="h-8 w-8 rounded-full object-cover">`;
            } else {
                avatar.textContent = (user.username || 'U').charAt(0).toUpperCase();
            }
        }
        if (username) username.textContent = user.username || 'User';
        if (email) email.textContent = user.email || '';
        if (profileLink) profileLink.href = `/user/${user.username}`;
    }

    async function checkAuth() {
        const token = localStorage.getItem('tuiml_token');
        const user = JSON.parse(localStorage.getItem('tuiml_user') || 'null');

        if (token && user) {
            document.getElementById('auth-logged-out')?.classList.add('hidden');
            document.getElementById('auth-logged-in')?.classList.remove('hidden');
            updateUserUI(user);

            // Fetch fresh profile to get latest avatar_url
            try {
                const resp = await fetch('/api/users/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (resp.ok) {
                    const profile = await resp.json();
                    user.avatar_url = profile.avatar_url || null;
                    localStorage.setItem('tuiml_user', JSON.stringify(user));
                    updateUserUI(user);
                }
            } catch (e) {}
        } else {
            document.getElementById('auth-logged-out')?.classList.remove('hidden');
            document.getElementById('auth-logged-in')?.classList.add('hidden');
        }
    }

    // Logout function
    function logout() {
        localStorage.removeItem('tuiml_token');
        localStorage.removeItem('tuiml_user');
        window.location.href = '/';
    }

    // Check auth on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkAuth);
    } else {
        // DOM already loaded, run immediately
        checkAuth();
    }
</script>
