<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.project_name }} Documentation{% endblock %}</title>
    <meta name="description" content="{{ meta_description|default(config.default_meta_description) }}">
    <meta name="robots" content="{{ meta_robots|default('index,follow') }}">
    <link rel="canonical" href="{{ canonical_url|default(request.url|string if request is defined else '') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png?v=10">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/images/favicon.png?v=10">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png?v=10">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.project_name }}">
    <meta property="og:title" content="{% block og_title %}{{ config.project_name }} Documentation{% endblock %}">
    <meta property="og:description" content="{{ meta_description|default(config.default_meta_description) }}">
    <meta property="og:url" content="{{ canonical_url|default(request.url|string if request is defined else '') }}">
    <meta property="og:image" content="{{ og_image_url|default(request.url_for('static', path='images/tuiml_logo.png')|string if request is defined else '') }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ config.project_name }} Documentation{% endblock %}">
    <meta name="twitter:description" content="{{ meta_description|default(config.default_meta_description) }}">
    <meta name="twitter:image" content="{{ og_image_url|default(request.url_for('static', path='images/tuiml_logo.png')|string if request is defined else '') }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Highlight.js for code syntax (token colors live in api-doc.css) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <!-- Tailwind CSS (layout utilities in the generated content + nav/footer chrome) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"JetBrains Mono"', 'monospace'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="landing-page antialiased overflow-x-hidden">
    <!-- Navigation -->
    {% include 'components/_docs_navbar.html' %}

    <link rel="stylesheet" href="/static/css/oc.css">
    <script src="/static/js/oc.js"></script>
    <!-- Adapter: maps the generated content's utility classes onto the oc palette -->
    <link rel="stylesheet" href="/static/css/api-doc.css">

    <div class="oc-wrap">
        <section class="oc-section api-doc" style="padding-top: 48px;">
            {% block content %}{% endblock %}
        </section>
    </div>

    <!-- Footer -->
    {% include 'components/_footer.html' %}

    <script>
        // Copy Code Functionality
        const copyButtons = document.querySelectorAll('.copy-btn');
        copyButtons.forEach(btn => {
            btn.addEventListener('click', function () {
                const wrapper = this.closest('.code-block-wrapper');
                const codeBlock = wrapper.querySelector('code');
                const code = codeBlock.innerText;

                navigator.clipboard.writeText(code).then(() => {
                    const icon = this.querySelector('i');
                    const originalClass = icon.className;

                    icon.className = 'fa-solid fa-check text-green-500';

                    setTimeout(() => {
                        icon.className = originalClass;
                    }, 2000);
                });
            });
        });

        // Render KaTeX math when page loads
        document.addEventListener("DOMContentLoaded", function() {
            // Initialize syntax highlighting
            hljs.highlightAll();

            // Render display math
            document.querySelectorAll('.katex-display').forEach(function(el) {
                try {
                    katex.render(el.textContent, el, {
                        displayMode: true,
                        throwOnError: false
                    });
                } catch (e) {
                    console.error('KaTeX error:', e);
                }
            });

            // Render inline math
            document.querySelectorAll('.katex-inline').forEach(function(el) {
                try {
                    katex.render(el.textContent, el, {
                        displayMode: false,
                        throwOnError: false
                    });
                } catch (e) {
                    console.error('KaTeX error:', e);
                }
            });
        });
    </script>
</body>
</html>
