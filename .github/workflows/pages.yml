name: Deploy website to GitHub Pages

# Builds the static site in website/ and publishes it to GitHub Pages.
# Preview URL: https://tuiml.github.io/tuiml/  (BASE_PATH=/tuiml handles the subpath).
# For the tuiml.ai custom-domain cutover, drop BASE_PATH so build.py writes the
# CNAME and keeps root-absolute links — then point DNS at GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:   # allow manual runs from the Actions tab

# Least-privilege token: only what Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build static site
        working-directory: website
        env:
          BASE_PATH: /tuiml   # subpath preview; remove for the tuiml.ai cutover
        run: |
          uv sync
          uv run python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
