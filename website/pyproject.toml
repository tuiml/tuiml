[project]
name = "tuiml-website"
version = "0.1.6"
description = "TuiML landing page and documentation site"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "jinja2==3.1.3",
    "nbconvert>=7.17.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.0",
    "ipykernel>=7.2.0",
]
