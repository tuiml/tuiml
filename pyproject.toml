[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "numpy>=1.21.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tuiml"
version = "0.1.9"
description = "An open-source agentic ML ecosystem with a clean Python API, MCP server for AI agents, and a community Hub for sharing algorithms, datasets, and models"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Nilesh Verma"},
    {name = "Albert Bifet"},
    {name = "Bernhard Pfahringer"},
]
maintainers = [
    {name = "Nilesh Verma", email = "nilesh.verma@waikato.ac.nz"},
]
keywords = [
    "machine learning", "data mining", "ml", "llm-friendly",
    "classification", "regression", "clustering",
    "anomaly-detection", "time-series", "mcp",
    "agentic-ml", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "joblib>=1.0.0",
    "click>=8.0.0",
    "requests>=2.28.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    # Gradient boosting. Kept in the default install: ~111 MB of plain CPU
    # wheels, no CUDA and no platform lag, and they are what people reach for
    # first on tabular data. They are still imported *lazily* (see
    # tuiml/algorithms/gradient_boosting/_backend.py) -- being installed was
    # never the problem, being imported eagerly was, because each ships its own
    # OpenMP runtime and clashes with PyTorch's on macOS.
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
    # 2.x only. The 2.0 SDK replaced the low-level decorator API the MCP
    # server was built on (@server.list_tools / @server.call_tool / the
    # resource decorators) with constructor-registered on_* handlers, so the
    # two are not source-compatible and there is no single code path that
    # serves both. tuiml/agent/mcp/server.py targets 2.x.
    "mcp>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "bigtree>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "jupyter>=1.1.1",
    "build",
    "twine>=6.2.0",
]

# Algorithm backends — `import tuiml.sklearn` / `tuiml.capymoa` / `tuiml.weka`
# use these lazily. Native TuiML algorithms never require them; the wrappers
# raise a clear error at instantiation if the backing library is missing.
# `capymoa` and `weka` additionally need a Java runtime (11+) on PATH.
sklearn = ["scikit-learn>=1.7.0"]
capymoa = ["capymoa>=0.14.0"]
weka = ["python-weka-wrapper3>=0.3.0"]

# No-op alias. The three boosting libraries are required dependencies, so this
# resolves to what you already have. Kept so that existing Dockerfiles and CI
# configs carrying `pip install 'tuiml[boosting]'` keep working.
boosting = [
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
]

# Deep-learning backend for the neural tabular and forecasting models
# (FT-Transformer, SAINT, NODE, N-BEATS, NHITS, PatchTST). These are native
# TuiML implementations, not wrappers, but they need a tensor library with
# autograd. Everything else in the library — including NGBoost and every
# classical forecaster — is pure NumPy and never touches this.
torch = ["torch>=2.2.0"]

# Framework adapters — `import tuiml.agent.<framework>` uses these lazily.
openai        = ["openai>=1.0.0"]
anthropic     = ["anthropic>=0.30.0"]
langchain     = ["langchain-core>=0.3.0"]
"pydantic-ai" = ["pydantic-ai>=0.1.0"]
crewai        = ["crewai>=0.100.0"]

# One-shot: install every framework adapter at once.
frameworks = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "langchain-core>=0.3.0",
    "pydantic-ai>=0.1.0",
    "crewai>=0.100.0",
]

# One-shot: install every optional algorithm backend at once.
# capymoa and python-weka-wrapper3 both need a Java runtime (11+) on PATH.
backends = [
    "scikit-learn>=1.7.0",
    "capymoa>=0.14.0",
    "python-weka-wrapper3>=0.3.0",
]

# Everything: every wrapper backend, the neural models and the pretrained
# foundation model. Pulls in PyTorch, which on Linux resolves to the CUDA build
# and several gigabytes of NVIDIA runtime libraries unless the index is pinned
# to CPU wheels -- `uv pip install --torch-backend=cpu 'tuiml[all]'`, or the
# UV_TORCH_BACKEND=cpu environment variable. The bundled installer picks that
# automatically when it finds no GPU.
all = [
    "scikit-learn>=1.7.0",
    "capymoa>=0.14.0",
    "python-weka-wrapper3>=0.3.0",
    "torch>=2.2.0",
    "tabicl>=2.1.0",
]
# Pretrained tabular foundation models — `foundation.TabICLClassifier` and
# `foundation.TabICLRegressor`. Wraps the upstream `tabicl` package, which
# pulls torch itself and downloads its own ~150 MB checkpoint on first use.
#
# TuiML ships no model weights. TabICL's code *and* weights are BSD-3-Clause,
# matching TuiML's own license, so there is nothing for a user to accept. That
# is the reason it is the only foundation model integrated: several others
# (TabPFN, Google's TabFM) publish weights under non-commercial terms, which a
# BSD-3 wrapper cannot relicense.
foundation = [
    "tabicl>=2.1.0",
]

[project.urls]
Homepage = "https://tuiml.ai"
Repository = "https://github.com/tuiml/tuiml"
Documentation = "https://tuiml.ai/getting_started.html"
"Bug Tracker" = "https://github.com/tuiml/tuiml/issues"
Changelog = "https://tuiml.ai/changelog.html"

[project.scripts]
tuiml = "tuiml.cli:main"
tuiml-mcp = "tuiml.agent.mcp.server:main"

[tool.scikit-build]
cmake.version = ">=3.15"
cmake.build-type = "Release"
wheel.packages = ["tuiml"]
build-dir = "build/{wheel_tag}"
# The bundled landing/docs site (served via GitHub Pages) is not part of the
# Python package. wheel.packages already keeps it out of the wheel; exclude it
# from the sdist too so the source tarball stays lean.
# scratch/ is gitignored, so it should not reach the sdist anyway; naming it
# here means a stray local file cannot ship just because someone re-added it.
sdist.exclude = ["website", "scratch"]

[tool.scikit-build.cmake.define]
USE_OPENMP = "ON"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# No coverage flags here: unconditional --cov makes a bare `pytest` fail
# without pytest-cov installed, and writes htmlcov/ on every run. Ask for it
# explicitly instead:
#     uv run pytest --cov=tuiml --cov-report=term-missing

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Kept identical to [project.optional-dependencies].dev above. uv installs this
# group for a bare `uv sync`, while `pip install tuiml[dev]` and
# `uv sync --extra dev` read the extra; when the two disagreed, whether black
# and mypy were present depended on which command you happened to run.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "jupyter>=1.1.1",
    "build",
    "twine>=6.2.0",
]
